# zerops.yaml
zerops:
  # =========================================================================
  # 1. FRONTEND: Nginx Static Web Server
  # =========================================================================
  - setup: web
    build:
      base: nodejs@20
      envVariables:
        NODE_ENV: development
      buildCommands:
        - cd web && npm install
        - cd web && npm run build
      deployFiles:
        - ./web/dist
    run:
      base: nginx@latest
      documentRoot: web/dist
      ports:
        - port: 80
          httpSupport: true

  # =========================================================================
  # 2. BACKEND: Node.js/TypeScript API
  # =========================================================================
  - setup: api
    build:
      base: nodejs@20
      envVariables:
        NODE_ENV: development
      buildCommands:
        - cd api && npm install
        - cd api && npm run build
      deployFiles:
        - ./api/dist
        - ./api/node_modules
        - ./api/package.json
    run:
      base: nodejs@20
      ports:
        - port: 3000
          httpSupport: true
      start: node api/dist/server.js
      healthCheck:
        httpGet:
          port: 3000
          path: /health

  # =========================================================================
  # 3. WORKER: Python NLP & OCR background processor
  # =========================================================================
  - setup: worker
    build:
      base: python@3.11
      os: ubuntu
      buildCommands:
        # Install all dependencies into ./vendor so they travel with the application artifact
        - cd worker && pip install --target=./vendor -r requirements.txt
      deployFiles:
        - ./worker
    run:
      base: python@3.11
      os: ubuntu
      prepareCommands:
        - sudo apt-get update
        - sudo apt-get install -y poppler-utils tesseract-ocr pandoc libtesseract-dev
      start: python worker/main.py
      envVariables:
        # Point Python's module search to the deployed vendor folder
        PYTHONPATH: /var/www/worker/vendor

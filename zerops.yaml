# zerops.yaml
# Multi-Service Build and Deploy pipeline for Nginx Static, Node.js API, and Python Worker.
# Commit this file as 'zerops.yaml' to the root of your unified GitHub repository.

zerops:
  # =========================================================================
  # 1. FRONTEND: Nginx Static Web Server
  # =========================================================================
  - setup: web
    build:
      base: nodejs@20
      # Overrides the project-level NODE_ENV=production so that npm install
      # successfully installs devDependencies (like vite and typescript) for compilation.
      envVariables:
        NODE_ENV: development
      buildCommands:
        - cd web && npm install
        - cd web && npm run build
      deployFiles:
        - ./web/dist
    run:
      base: nginx@latest
      # Folder name used as the root of the publicly accessible web server content.
      # This is relative to /var/www where deployFiles places the './web/dist' folder.
      documentRoot: web/dist
      ports:
        - port: 80
          httpSupport: true

  # =========================================================================
  # 2. BACKEND: Node.js/TypeScript API
  # =========================================================================
  - setup: api
    build:
      base: nodejs@20
      # Overrides the project-level NODE_ENV=production so that npm install
      # successfully installs devDependencies (like typescript) for tsc compilation.
      envVariables:
        NODE_ENV: development
      buildCommands:
        - cd api && npm install
        - cd api && npm run build
      deployFiles:
        - ./api/dist
        - ./api/node_modules
        - ./api/package.json
    run:
      base: nodejs@20
      ports:
        - port: 3000
          httpSupport: true
      start: node api/dist/server.js
      healthCheck:
        httpGet:
          port: 3000
          path: /health

  # =========================================================================
  # 3. WORKER: Python NLP & OCR background processor
  # =========================================================================
  - setup: worker
    build:
      base: python@3.11
      os: ubuntu      # <-- CRITICAL: Sets the build environment to Ubuntu to pull precompiled wheels
      buildCommands:
        # Install all dependencies into ./vendor so they travel with the application artifact
        - cd worker && pip install --target=./vendor -r requirements.txt
      deployFiles:
        - ./worker
    run:
      base: python@3.11
      os: ubuntu
      # Custom runtime image configuration - install pdftotext, tesseract OCR, and pandoc
      prepareCommands:
        - sudo apt-get update
        - sudo apt-get install -y poppler-utils tesseract-ocr pandoc libtesseract-dev
      start: python worker/main.py
      envVariables:
        # Point Python's module search to the deployed vendor folder
        PYTHONPATH: /var/www/worker/vendor

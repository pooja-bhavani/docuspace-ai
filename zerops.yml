# zerops.yml
# Multi-Service Build and Deploy pipeline for Nginx Static, Node.js API, and Python Worker.
# Commit this file as 'zerops.yml' to the root of your unified GitHub repository.

zerops:
  # =========================================================================
  # 1. FRONTEND: Nginx Static Web Server
  # =========================================================================
  - setup: web
    build:
      base: nodejs@20
      envVariables:
        NODE_ENV: development
      buildCommands:
        - cd web && npm install
        - cd web && npm run build
      deployFiles:
        - ./web/dist
    run:
      base: nginx@latest
      documentRoot: web/dist
      ports:
        - port: 80
          httpSupport: true

  # =========================================================================
  # 2. BACKEND: Node.js/TypeScript API
  # =========================================================================
  - setup: api
    build:
      base: nodejs@20
      envVariables:
        NODE_ENV: development
      buildCommands:
        - cd api && npm install
        - cd api && npm run build
      deployFiles:
        - ./api/dist
        - ./api/node_modules
        - ./api/package.json
    run:
      base: nodejs@20
      ports:
        - port: 3000
          httpSupport: true
      start: /bin/sh -c "cd api && (node dist/server.js || node dist/src/server.js)"
      healthCheck:
        httpGet:
          port: 3000
          path: /health
      envVariables:
        PORT: 3000
        DB_HOST: ${db_hostname}
        DB_USER: ${db_user}
        DB_PASSWORD: ${db_password}
        DB_NAME: ${db_dbName}
        QDRANT_URL: http://${vector_hostname}:6333
        NATS_URL: nats://${queue_hostname}:4222
        S3_ENDPOINT: http://${storage_hostname}
        S3_ACCESS_KEY: ${storage_accessKeyId}
        S3_SECRET_KEY: ${storage_secretAccessKey}
        S3_BUCKET: docuspace-files

  # =========================================================================
  # 3. WORKER: Python NLP & OCR background processor
  # =========================================================================
  - setup: worker
    build:
      base: python@3.11
      os: ubuntu
      addToRunPrepare:
        - worker/requirements.txt
      buildCommands:
        - echo "Preparing worker source code..."
      deployFiles:
        - ./worker
    run:
      base: python@3.11
      os: ubuntu
      prepareCommands:
        - sudo apt-get update
        - sudo apt-get install -y poppler-utils tesseract-ocr pandoc libtesseract-dev
        - pip install -r worker/requirements.txt
      start: python worker/main.py
      envVariables:
        DB_HOST: ${db_hostname}
        DB_USER: ${db_user}
        DB_PASSWORD: ${db_password}
        DB_NAME: ${db_dbName}
        QDRANT_URL: http://${vector_hostname}:6333
        NATS_URL: nats://${queue_hostname}:4222
        S3_ENDPOINT: http://${storage_hostname}
        S3_ACCESS_KEY: ${storage_accessKeyId}
        S3_SECRET_KEY: ${storage_secretAccessKey}
        S3_BUCKET: docuspace-files
